# Builds FFmpeg and whisper-server for the two Mac targets, self-tests them, and publishes the
# archives as a GitHub release (tools-N). The app downloads these with apps/desktop/scripts/fetch-tools.mjs.
# Run it by hand: Actions → tools → Run workflow (pick the branch, then fill in the three inputs).
name: tools

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: whisper.cpp tag, for example v1.9.5
        required: true
      ffmpeg_ref:
        description: FFmpeg tag, for example n9.0.2
        required: true
      release:
        description: Release tag to publish, for example tools-1
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, os: macos-15, variants: 'metal' }
          - { target: mac-x64, os: macos-15-intel, variants: 'cpu' }
    runs-on: ${{ matrix.os }}
    env:
      WHISPER_REF: ${{ inputs.whisper_ref }}
      FFMPEG_REF: ${{ inputs.ffmpeg_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install nasm pkg-config

      - name: whisper-server (each variant)
        shell: bash
        run: |
          for variant in ${{ matrix.variants }}; do
            bash apps/desktop/scripts/build-whisper.sh "${{ matrix.target }}" "$variant"
          done

      - name: FFmpeg
        shell: bash
        run: bash apps/desktop/scripts/build-ffmpeg.sh "${{ matrix.target }}"

      - name: Self-test
        shell: bash
        run: bash apps/desktop/scripts/self-test.sh "${{ matrix.target }}" ${{ matrix.variants }}

      - name: Package
        shell: bash
        run: |
          bin="apps/desktop/resources/bin/${{ matrix.target }}"
          printf '{"whisper":"%s","ffmpeg":"%s","target":"%s"}\n' \
            "$WHISPER_REF" "$FFMPEG_REF" "${{ matrix.target }}" > "$bin/VERSIONS.json"
          tar -czf "echo-tools-${{ matrix.target }}.tar.gz" -C "$bin" .

      - uses: actions/upload-artifact@v4
        with:
          name: echo-tools-${{ matrix.target }}
          path: echo-tools-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      WHISPER_REF: ${{ inputs.whisper_ref }}
      FFMPEG_REF: ${{ inputs.ffmpeg_ref }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: echo-tools-*
          merge-multiple: true

      - name: Checksums and release
        shell: bash
        run: |
          sha256sum echo-tools-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$RELEASE" --title "$RELEASE" \
            --notes "whisper.cpp $WHISPER_REF, FFmpeg $FFMPEG_REF" \
            echo-tools-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY"
