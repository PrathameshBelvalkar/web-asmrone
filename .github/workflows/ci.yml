# Tests on every push to main and every pull request. Four jobs run in parallel.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/backend-express/package-lock.json
            web/frontend/package-lock.json
            apps/desktop/package-lock.json
      - run: cd web/backend-express && npm ci && npm run lint && npm run typecheck && npm test

  ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/backend-express/package-lock.json
            web/frontend/package-lock.json
            apps/desktop/package-lock.json
      - run: cd web/frontend && npm ci && npm run typecheck && npm test && npm run build

  desktop:
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/backend-express/package-lock.json
            web/frontend/package-lock.json
            apps/desktop/package-lock.json
      - run: cd apps/desktop && npm ci && npm run typecheck && npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The runner image has the Android SDK; AGP installs the platform it needs.
      - run: ./gradlew lint test assembleDebug --console=plain
